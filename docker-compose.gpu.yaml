services:
  api:
    container_name: wheat_api
    build:
      context: ./server
      dockerfile: Dockerfile.gpu
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./runs:/runs
      - ./results:/results
    environment:
      - DATA_DIR=/data
      - RUNS_DIR=/runs
      - RESULTS_DIR=/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  app:
    container_name: wheat_app
    build:
      context: ./apps
    ports:
      - "8501:8501"
    volumes:
      - ./results:/results
    environment:
      - API_URL=http://api:8000
      - RESULTS_DIR=/results
    depends_on:
      - api
    restart: unless-stopped
